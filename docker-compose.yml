services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: crud
    networks:
      - red36
    healthcheck:
            test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
            timeout: 20s
            retries: 10
    
  backend:
    build: ./backend/crud-application
    depends_on:
        db:
          condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/crud?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 1234
    networks:
      - red36
    ports:
      - "8080:8080"
    

  frontend:
    build: ./frontend/crudfront
    depends_on:
      - backend
    networks:
      - red36
    ports:
      - "3000:3000"
networks:
  red36: