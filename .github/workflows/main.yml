
name: CI-CD Spring Boot React

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Copiar codigo
        uses: actions/checkout@v4

      - name: Iniciar MySQL
        run: docker compose up -d --wait db

      - name: Test Backend
        working-directory: backend/crud-application
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3307/crud?useSSL=false&allowPublicKeyRetrieval=true
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: "1234"
        run: mvn clean test

      - name: Test Frontend
        working-directory: frontend/crudfront
        run: |
          npm ci
          CI=true npm test -- --watch=false

  build:
    needs: test
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Copiar codigo
        uses: actions/checkout@v4

      - name: Construir imagenes
        run: docker compose build

  deploy:
    needs: build
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Copiar codigo
        uses: actions/checkout@v4

      - name: Desplegar contenedores
        run: docker compose up -d --build
